<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <meta name="keywords" content="طراحی گرافیک، کاور ریلز، بنر استوری، طراحی اینستاگرام، کاور پست، هایلایت، بنر سایت، Alinex، طراح گرافیک" />

  <link rel="canonical" href="https://www.alinexx.ir" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1a9e7a;
      --green-dark: #0f7a5d;
      --green-light: #d4f4ec;
      --green-mid: #a8e6d4;
      --white: #ffffff;
      --off-white: #f5fdf9;
      --text: #1a2e28;
      --muted: #5a7a72;
      --border: #c8ede3;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Vazirmatn', sans-serif; font-weight: 600; background: var(--white); color: var(--text); overflow-x: hidden; }

    /* NAV */
    nav {
      position: fixed; top: 0; width: 100%; z-index: 100;
      background: rgba(255,255,255,0.97); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 1.2rem; display: flex; align-items: center; justify-content: space-between; height: 60px;
    }
    .nav-logo { display: flex; align-items: center; gap: .7rem; }
    .nav-logo img { width: 38px; height: 38px; border-radius: 10px; object-fit: contain; }
    .nav-logo span { font-size: 1.3rem; font-weight: 900; color: var(--green); letter-spacing: -0.5px; }
    .nav-links { display: flex; gap: 1.8rem; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--text); font-size: .9rem; font-weight: 700; transition: color .2s; }
    .nav-links a:hover { color: var(--green); }

    /* HERO */
    .hero {
      min-height: 100vh;
      background: linear-gradient(150deg, var(--off-white) 0%, var(--green-light) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 7rem 2rem 4rem; position: relative; overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; top: -100px; left: -100px;
      width: 450px; height: 450px;
      background: radial-gradient(circle, var(--green-mid) 0%, transparent 70%);
      opacity: .35; border-radius: 50%;
    }
    .hero-logo {
      width: 130px; height: 130px; border-radius: 28px;
      background: #fff; box-shadow: 0 12px 40px rgba(26,158,122,.2);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.8rem; overflow: hidden;
      animation: fadeDown .6s ease both;
    }
    .hero-logo img { width: 100%; height: 100%; object-fit: contain; }
    .hero-badge {
      display: inline-block; background: var(--green); color: #fff;
      font-size: .8rem; font-weight: 700; padding: .35rem 1.1rem; border-radius: 999px;
      margin-bottom: 1.4rem; animation: fadeDown .65s .05s ease both;
    }
    .hero h1 {
      font-size: clamp(2rem, 5.5vw, 3.6rem); font-weight: 900; line-height: 1.25; color: var(--text);
      animation: fadeDown .7s .1s ease both;
    }
    .hero h1 span { color: var(--green); }
    .hero-desc {
      max-width: 620px; margin: 1.2rem auto 0;
      font-size: 1rem; line-height: 2; color: var(--muted); font-weight: 600;
      animation: fadeDown .7s .15s ease both;
    }
    .hero-cta {
      margin-top: 2.4rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
      animation: fadeDown .7s .2s ease both;
    }
    .btn {
      padding: .85rem 2rem; border-radius: 12px; font-family: inherit;
      font-size: .95rem; font-weight: 700; cursor: pointer;
      text-decoration: none; border: none; transition: transform .2s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--green); color: #fff; box-shadow: 0 4px 20px rgba(26,158,122,.3); }
    .btn-primary:hover { box-shadow: 0 8px 28px rgba(26,158,122,.4); }
    .btn-ghost { background: transparent; color: var(--green); border: 2px solid var(--green); }
    .btn-ghost:hover { background: var(--green-light); }

    /* SECTIONS */
    .section { padding: 5rem 2rem; }
    .container { max-width: 920px; margin: 0 auto; }
    .section-label { font-size: .78rem; font-weight: 700; letter-spacing: 1.5px; color: var(--green); text-transform: uppercase; margin-bottom: .5rem; }
    .section-title { font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 900; line-height: 1.25; margin-bottom: 1rem; }
    .section-body { font-size: 1rem; line-height: 2; color: var(--muted); max-width: 640px; font-weight: 600; }

    /* ABOUT */
    .about-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; margin-top: 2.4rem; }
    .acard { background: var(--off-white); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; }
    .acard .icon { font-size: 1.7rem; margin-bottom: .8rem; }
    .acard h3 { font-size: 1rem; font-weight: 700; margin-bottom: .4rem; }
    .acard p { font-size: .88rem; color: var(--muted); line-height: 1.75; font-weight: 600; }

    /* SERVICES */
    .services-bg { background: var(--off-white); }
    .services-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap: 1rem; margin-top: 2.4rem; }
    .scard {
      background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 1.3rem 1.1rem;
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }
    .scard:hover { border-color: var(--green); box-shadow: 0 6px 22px rgba(26,158,122,.12); transform: translateY(-3px); }
    .scard .si { font-size: 1.5rem; margin-bottom: .6rem; }
    .scard h3 { font-size: .93rem; font-weight: 700; }

    /* PRICING */
    .pricing-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(270px,1fr)); gap: 1.4rem; margin-top: 2.4rem; }
    .pcard { border: 1.5px solid var(--border); border-radius: 18px; overflow: hidden; }
    .pcard-head { padding: 1.1rem 1.4rem; background: var(--off-white); display: flex; align-items: center; gap: .7rem; }
    .pcard-head .em { font-size: 1.4rem; }
    .pcard-head h3 { font-size: 1rem; font-weight: 800; }
    .tiers { padding: 1rem 1.4rem 1.4rem; display: flex; flex-direction: column; gap: .55rem; }
    .tier { display: flex; align-items: center; justify-content: space-between; padding: .6rem .9rem; border-radius: 10px; font-size: .9rem; }
    .tier.silver { background: #f0f0f0; }
    .tier.gold   { background: #fff8e6; }
    .tier.diamond{ background: var(--green-light); }
    .tlabel { display: flex; align-items: center; gap: .4rem; font-weight: 600; }
    .tprice { font-weight: 800; color: var(--green); }

    /* SOCIALS */
    .socials-bg { background: var(--off-white); }
    .socials-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: 1rem; margin-top: 2.4rem; }
    .social-link {
      display: flex; align-items: center; gap: .8rem;
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 1rem 1.2rem; text-decoration: none; color: var(--text);
      font-size: .9rem; font-weight: 600; transition: border-color .2s, transform .2s, box-shadow .2s;
    }
    .social-link:hover { border-color: var(--green); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(26,158,122,.12); color: var(--green); }
    .social-link .slogo { width: 40px; height: 40px; border-radius: 10px; object-fit: contain; flex-shrink: 0; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; }
    .social-link .stext { display: flex; flex-direction: column; gap: 1px; }
    .social-link .splatform { font-size: .73rem; color: var(--muted); font-weight: 600; }
    .social-link .shandle { font-size: .88rem; font-weight: 700; }

    /* CTA BAND */
    .cta-band { background: var(--green); padding: 4rem 2rem; text-align: center; }
    .cta-band h2 { font-size: 1.9rem; font-weight: 900; color: #fff; margin-bottom: .8rem; }
    .cta-band p { color: rgba(255,255,255,.8); font-size: 1rem; margin-bottom: 1.8rem; }
    .btn-white { background: #fff; color: var(--green); padding: .9rem 2.4rem; font-size: 1rem; }
    .btn-white:hover { box-shadow: 0 6px 24px rgba(0,0,0,.15); }

    /* FOOTER */
    footer { background: var(--text); color: rgba(255,255,255,.55); text-align: center; padding: 1.8rem 2rem; font-size: .85rem; }
    footer span { color: var(--green); font-weight: 700; }





    /* BLOG */
    .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 1.4rem; }
    .blog-card {
      background: #fff; border: 1.5px solid var(--border); border-radius: 18px;
      overflow: hidden; cursor: pointer;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .blog-card:hover { transform: translateY(-4px); box-shadow: 0 10px 32px rgba(26,158,122,.14); border-color: var(--green); }
    .blog-thumb {
      background: var(--green-light); height: 100px;
      display: flex; align-items: center; justify-content: center; font-size: 3rem;
    }
    .blog-body { padding: 1.2rem; }
    .blog-tag {
      display: inline-block; background: var(--green-light); color: var(--green);
      font-size: .72rem; font-weight: 800; padding: .2rem .7rem;
      border-radius: 999px; margin-bottom: .7rem;
    }
    .blog-body h3 { font-size: 1rem; font-weight: 800; margin-bottom: .5rem; line-height: 1.5; }
    .blog-body p { font-size: .85rem; color: var(--muted); line-height: 1.8; margin-bottom: .8rem; }
    .blog-read { font-size: .82rem; color: var(--green); font-weight: 800; }

    /* BLOG MODAL */
    .blog-modal {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 1rem;
    }
    .blog-modal.open { display: flex; }
    .blog-modal-box {
      background: #fff; border-radius: 20px; width: 100%; max-width: 600px;
      max-height: 85vh; overflow-y: auto; padding: 2rem;
      position: relative; animation: fadeDown .3s ease;
    }
    body.dark .blog-modal-box { background: #162520; }
    body.dark .blog-card { background: #1a2e28; }
    .modal-close {
      position: absolute; top: 1rem; left: 1rem;
      background: var(--off-white); border: none; border-radius: 50%;
      width: 36px; height: 36px; font-size: 1rem; cursor: pointer;
      font-family: inherit; font-weight: 700; color: var(--text);
    }
    #modalContent .blog-thumb { border-radius: 14px; margin-bottom: 1.2rem; height: 120px; }
    #modalContent .blog-tag { margin-bottom: .8rem; }
    #modalContent h2 { font-size: 1.3rem; font-weight: 900; margin-bottom: 1rem; line-height: 1.5; }
    #modalContent h4 { font-size: 1rem; font-weight: 800; color: var(--green); margin: 1.2rem 0 .4rem; }
    #modalContent p { font-size: .93rem; line-height: 2; color: var(--muted); font-weight: 600; }
    @media(max-width:600px) { .blog-grid { grid-template-columns: 1fr; } }
    /* FAQ */
    .faq-list { margin-top: 2rem; display: flex; flex-direction: column; gap: .8rem; }
    .faq-item { border: 1.5px solid var(--border); border-radius: 14px; overflow: hidden; }
    .faq-q {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 1.4rem; background: #fff; border: none; cursor: pointer;
      font-family: inherit; font-size: 1rem; font-weight: 700; color: var(--text);
      text-align: right; transition: background .2s;
    }
    .faq-q:hover { background: var(--off-white); }
    .faq-q.open { background: var(--green-light); color: var(--green); }
    .faq-icon { font-size: 1.4rem; font-weight: 400; color: var(--green); flex-shrink: 0; transition: transform .3s; }
    .faq-q.open .faq-icon { transform: rotate(45deg); }
    .faq-a {
      display: none; padding: 1rem 1.4rem 1.2rem;
      font-size: .95rem; line-height: 1.9; color: var(--muted);
      font-weight: 600; background: var(--off-white);
      border-top: 1px solid var(--border);
    }
    .faq-a.open { display: block; }
    /* VIDEOS */
    .videos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.4rem; }
    .video-card { border-radius: 16px; overflow: hidden; border: 1.5px solid var(--border); background: #fff; transition: box-shadow .2s, transform .2s; }
    .video-card:hover { box-shadow: 0 8px 28px rgba(26,158,122,.13); transform: translateY(-3px); }
    .video-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; }
    .video-wrap iframe { position: absolute; top: 0; right: 0; width: 100%; height: 100%; border: none; }
    .video-info { display: flex; align-items: center; justify-content: space-between; padding: .75rem 1rem; }
    .video-badge { background: var(--green-light); color: var(--green); font-size: .75rem; font-weight: 800; padding: .25rem .7rem; border-radius: 999px; }
    .video-num { font-size: .85rem; color: var(--muted); font-weight: 700; }

    /* PORTFOLIO */
    .portfolio-btn {
      display: inline-flex; align-items: center; gap: .6rem;
      background: var(--green); color: #fff;
      padding: 1rem 2rem; border-radius: 14px;
      font-size: 1rem; font-weight: 800; text-decoration: none;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(26,158,122,.3);
    }
    .portfolio-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(26,158,122,.4); }
    .coming-soon-box {
      margin-top: 2rem; border: 2px dashed var(--border);
      border-radius: 18px; padding: 3rem 2rem; text-align: center;
    }
    .coming-soon-box .cs-icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .coming-soon-box h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: .5rem; }
    .coming-soon-box p { color: var(--muted); font-size: .95rem; font-weight: 600; }

    @media(max-width:700px) { .videos-grid { grid-template-columns: 1fr; } .channels-btn-wrap { display: none; } }




    /* LANG TOGGLE */
    .lang-toggle {
      background: none; border: 2px solid var(--border); border-radius: 10px;
      padding: 6px 12px; cursor: pointer; font-size: .85rem; font-weight: 800;
      transition: background .2s, color .2s; color: var(--text); font-family: inherit;
    }
    .lang-toggle:hover { background: var(--green-light); color: var(--green); }
    .lang-toggle.active { background: var(--green); color: #fff; border-color: var(--green); }

    /* English mode */
    body.en { font-family: 'Inter', 'Segoe UI', sans-serif; }
    body.en [data-fa] { display: none !important; }
    body.en [data-en] { display: block !important; }
    body:not(.en) [data-en] { display: none !important; }
    body:not(.en) [data-fa] { display: block !important; }
    /* inline elements */
    body.en span[data-en], body.en a[data-en], body.en div[data-en] { display: inline !important; }
    body:not(.en) span[data-fa], body:not(.en) a[data-fa], body:not(.en) div[data-fa] { display: inline !important; }
    body.en .hero, body.en section, body.en nav { direction: ltr; text-align: left; }
    body.en .nav-links { flex-direction: row; }
    body.en .socials-grid, body.en .services-grid, body.en .pricing-grid,
    body.en .blog-grid, body.en .videos-grid, body.en .about-cards { direction: ltr; }
    body.en .social-link, body.en .service-card, body.en .acard { text-align: left; }
    body.en .faq-q { text-align: left; flex-direction: row-reverse; }
    body.en .tier { flex-direction: row-reverse; }
    
    /* REELS COVER CAROUSEL */
    .rc-wrap { margin-top: 2.2rem; position: relative; }
    .rc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; gap: 1rem; }
    .rc-head h3 { font-size: 1.15rem; font-weight: 900; }
    .rc-hint { font-size: .8rem; color: var(--muted); font-weight: 700; }
    .rc-track {
      display: flex; gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory;
      padding: .4rem .2rem 1rem; scrollbar-width: none; -webkit-overflow-scrolling: touch; cursor: grab;
    }
    .rc-track::-webkit-scrollbar { display: none; }
    .rc-track.drag { cursor: grabbing; scroll-snap-type: none; }
    .rc-slide {
      flex: 0 0 min(220px, 62vw); aspect-ratio: 9 / 16; scroll-snap-align: center;
      border-radius: 18px; overflow: hidden; position: relative;
      background: linear-gradient(160deg, var(--green-light), var(--green-mid));
      box-shadow: 0 8px 28px rgba(26,158,122,.18); border: 1px solid var(--border);
      transition: transform .25s;
    }
    .rc-slide:hover { transform: translateY(-4px); }
    .rc-slide img { width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; user-select: none; }
    .rc-slide.empty img { display: none; }
    .rc-slide.empty::after {
      content: attr(data-label); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--green-dark); font-weight: 800; font-size: .95rem;
    }
    .rc-nav { display: flex; align-items: center; justify-content: center; gap: .9rem; margin-top: .4rem; direction: ltr; }
    .rc-btn {
      width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); background: #fff;
      color: var(--green); font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: all .2s; font-family: inherit;
    }
    .rc-btn:hover { background: var(--green); color: #fff; }
    .rc-dots { display: flex; gap: .4rem; }
    .rc-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--green-mid); border: none; padding: 0; cursor: pointer; transition: all .25s; }
    .rc-dot.active { width: 22px; background: var(--green); }
    body.dark .rc-btn { background: #1a2e28; border-color: #1e3d32; }
    body.dark .rc-slide { border-color: #1e3d32; }

    /* DARK MODE */
    .dark-toggle {
      background: none; border: 2px solid var(--border); border-radius: 10px;
      padding: 6px 10px; cursor: pointer; font-size: 1.1rem;
      transition: background .2s; color: var(--text);
    }
    .dark-toggle:hover { background: var(--green-light); }

    body.dark {
      --green: #2bc49a;
      --green-dark: #1fa882;
      --green-light: #0d3328;
      --green-mid: #144d3a;
      --white: #0f1a16;
      --off-white: #162520;
      --text: #e8f5f0;
      --muted: #8ab5a5;
      --border: #1e3d32;
    }
    body.dark nav { background: rgba(15,26,22,0.97); }
    body.dark .mobile-menu { background: rgba(15,26,22,0.98); }
    body.dark .channels-dropdown { background: #162520; }
    body.dark .service-card, body.dark .acard, body.dark .video-card,
    body.dark .pcard, body.dark .social-link, body.dark .faq-q { background: #1a2e28; }
    body.dark .tier.silver { background: #1e2e28; }
    body.dark .tier.gold { background: #2a2a18; }
    body.dark .coming-soon-box { border-color: #1e3d32; }
    body.dark .faq-q.open { background: #0d3328; }
    body.dark .faq-a { background: #162520; }
    body.dark footer { background: #080f0d; }
    
    /* CHANNELS BTN */
    .channels-btn-wrap { position: relative; }
    .channels-btn {
      display: flex; align-items: center; gap: .4rem;
      background: var(--green); color: #fff;
      border: none; border-radius: 10px;
      padding: .45rem .9rem; font-family: inherit;
      font-size: .85rem; font-weight: 700; cursor: pointer;
      transition: background .2s;
    }
    .channels-btn:hover { background: var(--green-dark); }
    .channels-dropdown {
      display: none; position: absolute; top: calc(100% + 10px); left: 0;
      background: #fff; border: 1px solid var(--border);
      border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.12);
      min-width: 240px; z-index: 200; overflow: hidden;
      animation: fadeDown .2s ease;
    }
    .channels-dropdown.open { display: block; }
    .channels-dropdown a {
      display: flex; align-items: center; gap: .8rem;
      padding: .75rem 1rem; text-decoration: none;
      color: var(--text); font-size: .88rem; font-weight: 700;
      transition: background .15s;
      border-bottom: 1px solid var(--border);
    }
    .channels-dropdown a:last-child { border-bottom: none; }
    .channels-dropdown a:hover { background: var(--off-white); color: var(--green); }
    .channels-dropdown a img { width: 28px; height: 28px; border-radius: 7px; object-fit: contain; flex-shrink: 0; }
    
    /* MOBILE NAV */
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; border-radius: 10px; border: 2px solid var(--border); background: transparent; transition: background .2s; }
    .hamburger:hover { background: var(--green-light); }
    .hamburger span { display: block; width: 26px; height: 2.5px; background: var(--text); border-radius: 3px; transition: all .3s; }
    .hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
    .mobile-menu {
      display: none; position: fixed; top: 64px; right: 0; left: 0; z-index: 99;
      background: rgba(255,255,255,0.98); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      flex-direction: column; padding: 1rem 2rem 1.5rem;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { text-decoration: none; color: var(--text); font-size: 1rem; font-weight: 700; padding: .7rem 0; border-bottom: 1px solid var(--border); }
    .mobile-menu a:last-child { border-bottom: none; }
    .mobile-menu a:hover { color: var(--green); }

    /* BOTTOM NAV - hidden */
    .bottom-nav { display: none !important; }

    @media (min-width: 701px) { .nav-links { display: flex !important; } .hamburger { display: none !important; } }
    @media (max-width: 700px) {
      .nav-links { display: none !important; }
      .channels-btn-wrap { display: none !important; }
      .hamburger { display: flex !important; }
      .bottom-nav { display: flex; }
      body { padding-bottom: 0; }
      .hero { padding-top: 5rem; }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (max-width:600px) {
      .nav-links { display: none; }
      .about-cards { grid-template-columns: 1fr; }
      .services-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
